# Place inside the existing cjw32.xyz HTTPS server block.
# REPLACE the old /, /blog/, /tool/, /work/, /tool-api/, /tool-ws/ locations.
# Keep the existing certificate, ACME, /en/, /api, /ai, /socket.io/, /models/ rules.
# Apply one project at a time after its loopback endpoint is healthy.

location = /blog { return 308 /blog/; }
location ^~ /blog/ {
    proxy_pass http://127.0.0.1:18081;
    proxy_set_header Host $host;
}
location = /tool { return 308 /tool/; }
location ^~ /tool/ {
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
}
location = /work { return 308 /work/; }
location ^~ /work/ {
    proxy_pass http://127.0.0.1:18083;
    proxy_set_header Host $host;
}
location = /app3 { return 308 /tool/; }
location = /app3/ { return 308 /tool/; }

location /tool-api/ {
    proxy_pass http://127.0.0.1:13003/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 50m;
}
location /tool-ws/ {
    proxy_pass http://127.0.0.1:13003/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
location /mindmap-ws/ {
    proxy_pass http://127.0.0.1:11234/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
location / {
    proxy_pass http://127.0.0.1:18080;
    proxy_set_header Host $host;
}
