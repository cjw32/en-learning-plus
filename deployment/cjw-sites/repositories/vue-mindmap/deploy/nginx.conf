worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location = /work { return 308 /work/; }
    location /work/assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /work/ { try_files $uri $uri/ /work/index.html; add_header Cache-Control "no-cache"; }
    location / { return 404; }
    location ~ /\. { deny all; }
  }
}
