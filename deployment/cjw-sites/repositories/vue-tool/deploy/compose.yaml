services:
  web:
    image: ${WEB_IMAGE:?Missing immutable web image}
    ports: ["127.0.0.1:18082:8080"]
    mem_limit: 96m
    cpus: 0.5
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    image: ${API_IMAGE:?Missing immutable API image}
    # Existing BaoTa MongoDB uses host networking; bind the API to loopback explicitly.
    network_mode: host
    mem_limit: 256m
    cpus: 1.0
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    env_file: /opt/cjw-sites/vue-tool/runtime.env
    environment:
      PORT: "13003"
      HOST: "127.0.0.1"
    extra_hosts: ["host.docker.internal:127.0.0.1"]
