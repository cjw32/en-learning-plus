# Install as a separate BaoTa vhost before issuing the certificate.
server {
    listen 80;
    server_name resume.cjw32.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/resume-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 503; }
}
