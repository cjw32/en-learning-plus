# Requires an issued certificate at the paths below.
server {
    listen 80;
    server_name resume.cjw32.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/resume-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://resume.cjw32.xyz$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name resume.cjw32.xyz;
    ssl_certificate /etc/letsencrypt/live/resume.cjw32.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resume.cjw32.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ResumeSSL:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 15m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    access_log /www/wwwlogs/resume.cjw32.xyz.log;
    error_log /www/wwwlogs/resume.cjw32.xyz.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_set_header Host resume.cjw32.xyz;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Better Auth trusts these headers too; discard client-supplied values.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header CF-Connecting-IPv6 "";
        proxy_set_header True-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
