name: cjw-resume

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:7456ef82e5f5bc43d997f4781bbd7c0d6389bff397564649a356e206ba473aee
    restart: unless-stopped
    environment:
      POSTGRES_USER: resume
      POSTGRES_DB: resume
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure.py first}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30, -c, work_mem=2MB]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: [CMD-SHELL, pg_isready -U resume -d resume]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  app:
    image: ghcr.io/reactive-resume/reactive-resume:v5.3.0@sha256:828dd46b21bf922ffaac870c7cf5895d97bc4b1f48e2eb08880284d241de4d35
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      NODE_OPTIONS: --max-old-space-size=384
      DATABASE_URL: postgresql://resume:${POSTGRES_PASSWORD:?Run configure.py first}@postgres:5432/resume
      LOCAL_STORAGE_PATH: /app/data
    ports: ['127.0.0.1:18084:3000']
    volumes:
      - uploads:/app/data
    mem_limit: 512m
    cpus: 1
    pids_limit: 150
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  postgres-data:
  uploads:
